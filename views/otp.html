<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رمز التحقق</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded shadow-md w-full max-w-md text-center">
        <h1 class="text-2xl font-bold mb-4">أدخل رمز التحقق</h1>
        <p class="text-gray-600 mb-4">تم إرسال الرمز إلى بريدك الإلكتروني</p>
        <form action="/submit-otp" method="POST">
            <input type="text" name="otp" placeholder="رمز التحقق" class="w-full p-2 mb-4 border rounded text-center text-xl tracking-widest" required>
            <button type="submit" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-700">تحقق</button>
        </form>
    </div>
</body>
</html>
