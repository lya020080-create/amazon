<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-4 text-center">تسجيل الدخول</h1>
        <form action="/submit-login" method="POST">
            <input type="text" name="email" placeholder="البريد الإلكتروني" class="w-full p-2 mb-4 border rounded" required>
            <input type="password" name="password" placeholder="كلمة المرور" class="w-full p-2 mb-4 border rounded" required>
            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">دخول</button>
        </form>
        <p class="text-center mt-4 text-sm"><a href="/otp" class="text-blue-600 hover:underline">نسيت كلمة المرور؟</a></p>
    </div>
</body>
</html>
